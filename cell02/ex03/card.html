<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">

        <!-- Header -->
        <header class="card-header">
            <h1>My Profile</h1>
        </header>

        <!-- Invisible table used only to align content -->
        <table class="card-table">
            <tr>
                <td>
                    <img class="avatar"
                         src="https://i.pinimg.com/736x/3e/ae/ab/3eaeab7a50c6da0c98d1ada85cd20b82.jpg"
                         alt="Profile picture">
                </td>
            </tr>
            <tr>
                <td class="login">palm.chananchxda</td>
            </tr>
            <tr>
                <td class="location">📍 Bangkok</td>
            </tr>
            <tr>
                <td class="description">life is art</td>
            </tr>
            <tr>
                <td>
                    <div class="socials">
                        <a href="https://www.instagram.com/palm.chananchxda/"
                           class="social-icon"
                           title="Instagram"
                           target="_blank"
                           rel="noopener noreferrer">
                           <span>IG</span>
                        </a>
                        <a href="https://discord.com/users/your_discord_id"
                           class="social-icon"
                           title="Discord"
                           target="_blank"
                           rel="noopener noreferrer">
                           <span>DC</span>
                        </a>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <a href="#" class="contact-btn">Contact</a>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
